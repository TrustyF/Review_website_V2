services:
  db:
    image: postgres:17.10
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  db-backup:
    image: prodrigestivill/postgres-backup-local
    container_name: pgdump_backup
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - ./backups:/backups
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080

  # Self-hosted app server (see the ThinkCentre migration plan). Sourced from
  # NEON_DATABASE_URL/NEON_DIRECT_URL (see .env.example), not the plain
  # DATABASE_URL/DIRECT_URL used by local dev and the local `db` service above
  # — the DB itself isn't migrating, only the front-end, and keeping separate
  # var names means `.env` holds both and nothing needs manually swapping
  # before a build. Build secrets (below, sourced from this same .env via the
  # top-level `secrets:` block) are only consumed
  # at image-build time (prisma migrate deploy + the build-time search-index
  # rebuild) and never persisted into the image's layers — see Dockerfile's
  # --mount=type=secret usage. The matching `environment` entries are what the
  # running container actually reads at runtime.
  app:
    build:
      context: .
      secrets:
        - database_url
        - direct_url
        - r2_account_id
        - r2_access_key_id
        - r2_secret_access_key
        - r2_bucket_name
        - r2_public_url
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${NEON_DATABASE_URL}
      DIRECT_URL: ${NEON_DIRECT_URL}
      IMAGE_STORAGE_DRIVER: r2
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_TRUST_HOST: "true"
      SITE_URL: ${SITE_URL}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN}
      TMDB_API_KEY: ${TMDB_API_KEY}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}
      COMIC_VINE_KEY: ${COMIC_VINE_KEY}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

volumes:
  pgdata:

# Sourced from this same .env at `docker compose build` time and exposed to
# the Dockerfile only via --mount=type=secret,env=... (see Dockerfile) — kept
# out of build args/image layers since these are real Neon/R2 credentials.
secrets:
  database_url:
    environment: NEON_DATABASE_URL
  direct_url:
    environment: NEON_DIRECT_URL
  r2_account_id:
    environment: R2_ACCOUNT_ID
  r2_access_key_id:
    environment: R2_ACCESS_KEY_ID
  r2_secret_access_key:
    environment: R2_SECRET_ACCESS_KEY
  r2_bucket_name:
    environment: R2_BUCKET_NAME
  r2_public_url:
    environment: R2_PUBLIC_URL