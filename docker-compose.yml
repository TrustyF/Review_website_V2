# TODO: Make app able to run from fresh build. Tested via a real fresh
# `git clone` + `cp .env.example .env` + `docker compose up -d` on the host
# (a throwaway `review-website-nextjs-fresh-test` checkout) — found:
#   - `docker compose up -d` with no service names also starts `cloudflared`
#     (fails without a real CLOUDFLARE_TUNNEL_TOKEN, can't be defaulted).
#     Right command is `docker compose up -d db app`, not bare `up -d` —
#     undocumented anywhere right now. Add `maintenance` too if you want the
#     scheduled jobs (see its own comment below) running.
#   - AUTH_SECRET is blank in .env.example and NextAuth v5 hard-throws
#     `MissingSecret` in production the moment anything calls auth() (most
#     pages), unlike DATABASE_URL/IMAGE_STORAGE_DRIVER which now have real
#     fallbacks — no code path degrades gracefully without it.
#   - Two host-specific test-only gotchas already resolved during that
#     same session, not app bugs: ports 5432/3000 collide with the real
#     production containers on the same host (fix: a
#     docker-compose.override.yml remapping them for a side-by-side test),
#     and a leftover `db` volume from an earlier failed attempt in the same
#     directory carried over stale data across a supposedly "fresh" retry
#     (fix: `docker compose down -v` before retrying).
services:
  # The permanent production database (migrated off Neon), not just a local
  # dev sidecar — needs `restart` like everything else here. Port bound to
  # loopback only: nothing outside the host needs to reach Postgres directly
  # (the `app`/`maintenance` services reach it over the compose network as
  # `db:5432`) — `127.0.0.1:5432` still lets you `psql`/`prisma studio`
  # against it from the host itself (e.g. over an SSH tunnel) without
  # exposing it to the LAN.
  #
  # POSTGRES_USER/PASSWORD/DB default to user/password/review_db when unset —
  # these are inherently local/throwaway credentials (a fresh Postgres
  # container with no external exposure), safe to bake a convention default
  # into, unlike AUTH_SECRET or any API key. Lets `docker compose up` work
  # against a real local db with zero .env configured; still overridable.
  db:
    image: postgres:17.11
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-review_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Shared transient staging with `maintenance` (see its own /backups
      # mount) for the two-step backup: ofelia's backup_dump job-exec below
      # writes the gzipped dump here, `maintenance`'s backup_upload job-exec
      # picks up the newest one and uploads it to R2.
      - ./backups:/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-review_db}",
        ]
      interval: 3s
      timeout: 3s
      retries: 10
    # ofelia (see its own service below) discovers jobs via these labels and
    # runs them with `docker exec` against this same container — pg_dump
    # needs to run here specifically, dumping over the container's own local
    # socket rather than the network, same as the old host-side `docker
    # compose exec db pg_dump` did. Plain `-f` dump-then-gzip rather than a
    # `pg_dump | gzip >` pipe: with no pipefail in POSIX sh, a failed pg_dump
    # mid-pipe wouldn't fail this whole command, and a corrupt-but-present
    # .sql.gz would look like a real backup to the upload job.
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.backup_dump.schedule: "0 3 * * *"
      ofelia.job-exec.backup_dump.command: "sh -c 'set -e; rm -f /backups/*.sql /backups/*.sql.gz; pg_dump -U $$POSTGRES_USER -f /backups/$(date -u +%Y-%m-%dT%H-%M-%SZ).sql $$POSTGRES_DB; gzip /backups/*.sql'"

  # Self-hosted app server (see the self-hosting migration plan). `db` is now
  # the permanent production database (migrated off Neon), not just a local
  # dev sidecar — so `app` depends on it directly rather than pointing at an
  # external host.
  #
  # DATABASE_URL differs between build and runtime because the build
  # container isn't attached to this compose file's network the way a
  # running container is: the build secret (below) reads the plain
  # DATABASE_URL from `.env` (host-facing, `localhost:5432` — the same value
  # local dev already uses, since `db`'s port is published to the host) and
  # `network: host` on the build makes that resolve correctly during `docker
  # compose build`. The `environment:` entry below is a *different*,
  # compose-network-facing URL (`db:5432`) for the actually-running
  # container. `db` must already be up before building `app`, since compose
  # doesn't gate `build:` on `depends_on`.
  #
  # No DIRECT_URL anywhere — that split only ever existed for Neon's pooler;
  # local Postgres has none, so prisma.config.ts's fallback to DATABASE_URL
  # applies both at build and runtime, same as local dev already relied on.
  #
  # R2 build secrets are only consumed at image-build time (the build-time
  # search-index rebuild) and never persisted into the image's layers — see
  # Dockerfile's --mount=type=secret usage.
  app:
    build:
      context: .
      network: host
      # Passed through to the Dockerfile's own `ARG IMAGE_STORAGE_DRIVER=r2`
      # default — without this, the build always used "r2" regardless of
      # .env (nothing was overriding that ARG), so the build-time
      # search-index rebuild always required real R2 credentials even when
      # IMAGE_STORAGE_DRIVER was deliberately left unset for local disk.
      args:
        IMAGE_STORAGE_DRIVER: ${IMAGE_STORAGE_DRIVER}
      secrets:
        - database_url
        - r2_account_id
        - r2_access_key_id
        - r2_secret_access_key
        - r2_bucket_name
        - r2_public_url
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      firewall-init:
        condition: service_completed_successfully
    # Loopback only: `cloudflared` reaches `app` over the compose network
    # (as `app:3000`), not through this published port — this is purely for
    # debugging directly on the host (`curl localhost:3000`), not meant to be
    # reachable from the LAN.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-review_db}
      # Was hardcoded to "r2" here, ignoring .env entirely — see
      # image-storage.ts's own opt-in design (unset = local disk). Production
      # is unaffected: its real .env already sets this to "r2" explicitly.
      IMAGE_STORAGE_DRIVER: ${IMAGE_STORAGE_DRIVER}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      AUTH_TRUST_HOST: "true"
      # Auth.js v5 needs its own canonical base URL explicitly — the tunneled
      # request's Host header isn't reliably reaching it as
      # review.arthursirjacobs.com, so without this it falls back to the
      # standalone server's own bind address (HOSTNAME=0.0.0.0 from the
      # Dockerfile) and builds broken OAuth redirect_uris. Same value as
      # SITE_URL (both are "the canonical public URL"), reused directly
      # rather than a second var to keep in sync.
      AUTH_URL: ${SITE_URL}
      SITE_URL: ${SITE_URL}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN}
      TMDB_API_KEY: ${TMDB_API_KEY}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}
      COMIC_VINE_KEY: ${COMIC_VINE_KEY}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

  # Cloudflare Tunnel exposing `app` at review.arthursirjacobs.com, so the
  # host needs no inbound port-forwarding. Token-based (created via the
  # Cloudflare dashboard's Networking > Tunnels > Routes UI, not a locally
  # managed config.yml) — the ingress rules (hostname -> service) live on
  # Cloudflare's side, not in this repo. On the same default network as `app`
  # so it can reach it by service name.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

  # Runs the scheduled jobs that used to be GitHub Actions workflows
  # (enrich-db, cleanup-*, purge-deleted-changelogs, backup-database), which
  # broke once the DB stopped being reachable from the public internet.
  # Built from the `deps` Dockerfile stage (full node_modules incl.
  # devDependencies like tsx, plus a generated Prisma client) rather than the
  # trimmed `runner` stage `app` uses, since these are source-level tsx
  # scripts, not the built server.
  #
  # Kept running via `sleep infinity` (rather than the old ad hoc `docker
  # compose run --rm maintenance npm run <script>` invoked by the host's
  # crontab) purely so ofelia's job-exec labels below have a live container
  # to `docker exec` into — this has no process of its own beyond that.
  # Scripts are invoked as `sh <path>` rather than executed directly, so a
  # lost executable bit (has happened before on this repo, from editing on
  # Windows — see run-job.sh's own history) can't silently break a job again.
  maintenance:
    build:
      context: .
      target: maintenance
      # The `deps` stage's `prisma generate` needs DATABASE_URL to resolve to
      # *something* at build time (see Dockerfile's own comment on this) —
      # without declaring the secret here too, `deps`' build only worked
      # when Docker happened to reuse a layer cached by `app`'s build (which
      # does declare it); once that cache expires, this build fails outright
      # with a missing secret file.
      secrets:
        - database_url
    restart: unless-stopped
    command: ["sleep", "infinity"]
    depends_on:
      db:
        condition: service_healthy
    # Shared transient staging with `db` — see its own /backups mount and
    # backup_dump job-exec label. Not a durable backup location itself (R2
    # is) — upload-backup.sh deletes the file here right after uploading.
    volumes:
      - ./backups:/backups
    # ofelia (see its own service below) discovers jobs via these labels and
    # runs them with `docker exec` against this same container. Each
    # schedule matches the old crontab's exactly. notify_cron_failure is
    # triggered by run-job.sh on any non-zero exit, same as the old
    # run-and-notify.sh did — see that script's own comment.
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.cleanup_posters.schedule: "0 0 * * *"
      ofelia.job-exec.cleanup_posters.command: "sh src/server/maintenance/cron/run-job.sh cleanup_posters npm run cleanup_posters"
      ofelia.job-exec.cleanup_cropped_images.schedule: "0 5 * * *"
      ofelia.job-exec.cleanup_cropped_images.command: "sh src/server/maintenance/cron/run-job.sh cleanup_cropped_images npm run cleanup_cropped_images"
      ofelia.job-exec.purge_deleted_changelogs.schedule: "0 6 * * *"
      ofelia.job-exec.purge_deleted_changelogs.command: "sh src/server/maintenance/cron/run-job.sh purge_deleted_changelogs npm run purge_deleted_changelogs"
      # Not "0 0 * * 0" — ofelia's 5-field cron parser rejects `0` as
      # Sunday in the weekday field (accepts 1-7 there, not 0-6), confirmed
      # by reproducing it against a scratch container. `@weekly` means the
      # same thing (midnight Sunday) and is what ofelia's own docs use for
      # this exact case.
      ofelia.job-exec.enrich_db.schedule: "@weekly"
      ofelia.job-exec.enrich_db.command: "sh src/server/maintenance/cron/run-job.sh enrich_db npm run enrich_db"
      # 5 minutes after `db`'s backup_dump job — comfortably enough for a
      # personal-scale dump to finish first; see upload-backup.sh's own
      # comment on how a failed/missing dump still surfaces as a failure
      # notification from here.
      ofelia.job-exec.backup_upload.schedule: "5 3 * * *"
      ofelia.job-exec.backup_upload.command: "sh src/server/maintenance/cron/run-job.sh backup_database sh src/server/maintenance/cron/upload-backup.sh"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-review_db}
      # Was hardcoded to "r2" here too — same fix as `app`'s own comment above.
      IMAGE_STORAGE_DRIVER: ${IMAGE_STORAGE_DRIVER}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      R2_BACKUP_ACCESS_KEY_ID: ${R2_BACKUP_ACCESS_KEY_ID}
      R2_BACKUP_SECRET_ACCESS_KEY: ${R2_BACKUP_SECRET_ACCESS_KEY}
      R2_BACKUP_BUCKET_NAME: ${R2_BACKUP_BUCKET_NAME}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN}
      TMDB_API_KEY: ${TMDB_API_KEY}
      IGDB_CLIENT_ID: ${IGDB_CLIENT_ID}
      IGDB_CLIENT_SECRET: ${IGDB_CLIENT_SECRET}
      COMIC_VINE_KEY: ${COMIC_VINE_KEY}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY}

  # Docker-native job scheduler, replacing the host crontab entirely — job
  # definitions live as `ofelia.job-exec.*` labels on `db`/`maintenance`
  # above, so the whole schedule is version-controlled in this file instead
  # of separately-maintained host state (a crontab plus the now-deleted
  # run-and-notify.sh/backup-database.sh host wrapper scripts). Discovers
  # labeled containers via the Docker socket and runs each job with `docker
  # exec` against whichever container its labels are on — no port, no LAN
  # exposure, nothing for docker-user-lan-isolation.sh to gate.
  ofelia:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Uptime monitoring: pings `app` (and can be pointed at review.arthursirjacobs.com
  # itself) and alerts if it goes down. Bound to all interfaces (not just
  # loopback like `app`/`db`) so it's reachable from other devices on the
  # home LAN without an SSH tunnel — still not internet-reachable, since
  # nothing forwards these ports from the router, and it has its own login
  # (forced on first run). Widens the trust boundary from "only this host"
  # to "anything on the LAN" — accepted deliberately since this is just a
  # monitoring dashboard, not `db`/`app`.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    depends_on:
      firewall-init:
        condition: service_completed_successfully
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data

  # System/container resource monitoring (CPU, RAM, disk, network, per-container
  # stats) — hub is the dashboard + data store, agent is what actually reads
  # the host's stats and reports them in. Same LAN-reachable rationale as
  # uptime-kuma above.
  beszel-hub:
    image: henrygd/beszel:latest
    restart: unless-stopped
    depends_on:
      firewall-init:
        condition: service_completed_successfully
    ports:
      - "8090:8090"
    volumes:
      - beszel-hub-data:/beszel_data

  # Applies the DOCKER-USER iptables rules (see scripts/docker-user-lan-
  # isolation.sh) that stop this project's Docker network from reaching the
  # LAN/other private ranges. Runs as part of the compose stack itself
  # (rather than a hand-installed host-level systemd unit) so a fresh deploy
  # can never forget or drift from this protection — `docker compose up`
  # reapplies it (idempotently) on every redeploy. `network_mode: host` +
  # `NET_ADMIN` are required since DOCKER-USER is a host-level iptables
  # chain, not reachable from a container's own network namespace. Exits
  # after applying the rules; other services block on it via
  # `service_completed_successfully` so they never come up LAN-reachable
  # before this has run.
  firewall-init:
    image: alpine:3.20
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./scripts/docker-user-lan-isolation.sh:/docker-user-lan-isolation.sh:ro
    # Invoked as `sh /docker-user-lan-isolation.sh` rather than executing the
    # bind-mounted script directly — this repo's had git-on-Windows fail to
    # preserve the executable bit on shell scripts before (see "Changed mode
    # to register as executable"), and this sidesteps that class of bug
    # entirely rather than relying on the bit surviving every future edit.
    entrypoint:
      [
        "sh",
        "-c",
        "apk add --no-cache iptables >/dev/null && sh /docker-user-lan-isolation.sh",
      ]
    restart: "no"

  # `network_mode: host` (rather than the compose network everything else
  # uses) is what Beszel's own docs call for here — it's how the agent gets
  # accurate host-level network/disk stats instead of just the container's
  # own. Docker socket is mounted read-only so it can also report per-container
  # stats (for `app`, `db`, etc.) alongside host-level ones.
  #
  # BESZEL_AGENT_KEY has no default and can't be filled in ahead of time: it's
  # a public key beszel-hub generates when you add a new "system" from its web
  # UI (port 8090 above) — create the system there first, copy the key it
  # shows you into .env, then start this service.
  beszel-agent:
    image: henrygd/beszel-agent:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      KEY: ${BESZEL_AGENT_KEY}
      HUB_URL: http://127.0.0.1:8090

  # Log viewer: reads every container's logs live from the Docker socket —
  # app, db, and (since `docker exec` output isn't part of a container's own
  # log stream) every scheduled job's run, which shows up under `ofelia`'s
  # own logs rather than under `maintenance`/`db`. Same LAN-reachable
  # rationale as uptime-kuma/beszel-hub above.
  #
  # DOZZLE_AUTH_PROVIDER=simple gates the UI behind a login (Dozzle has none
  # by default, unlike uptime-kuma/beszel-hub which force one on first run)
  # — backed by a users.yml this can't generate on its own the way
  # beszel-agent's key is issued via its hub's web UI. `generate` only prints
  # the YAML to stdout, it does NOT write /data/users.yml itself — without
  # that file present, dozzle fatal-errors and crash-loops on every start
  # (published port never actually listens). One-time setup, run once from
  # the host BEFORE `docker compose up -d dozzle`:
  #   docker compose run --rm dozzle generate admin --password <pw> -n "Admin" > /tmp/users.yml
  #   docker run --rm -v review-website-nextjs_dozzle-data:/data -v /tmp/users.yml:/src/users.yml:ro busybox cp /src/users.yml /data/users.yml
  # (dozzle's own image has no shell, hence the busybox helper) then start
  # dozzle normally.
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    depends_on:
      firewall-init:
        condition: service_completed_successfully
    environment:
      DOZZLE_AUTH_PROVIDER: simple
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./cron-logs:/cron-logs:ro
      - dozzle-data:/data

volumes:
  pgdata:
  uptime-kuma-data:
  beszel-hub-data:
  dozzle-data:

# Pinned rather than left to Docker's IPAM allocator so
# scripts/docker-user-lan-isolation.sh's hardcoded SUBNET can never silently
# drift from whatever subnet this project's network actually gets — this is
# the subnet already in use, so pinning it here is a no-op today and only
# guards against a future `docker compose down` + network recreation picking
# a different one.
networks:
  default:
    ipam:
      config:
        - subnet: 172.19.0.0/16

# Sourced from this same .env at `docker compose build` time and exposed to
# the Dockerfile only via --mount=type=secret,env=... (see Dockerfile) — kept
# out of build args/image layers since these are real R2 credentials (and,
# for database_url, the local Postgres password).
secrets:
  database_url:
    environment: DATABASE_URL
  r2_account_id:
    environment: R2_ACCOUNT_ID
  r2_access_key_id:
    environment: R2_ACCESS_KEY_ID
  r2_secret_access_key:
    environment: R2_SECRET_ACCESS_KEY
  r2_bucket_name:
    environment: R2_BUCKET_NAME
  r2_public_url:
    environment: R2_PUBLIC_URL
