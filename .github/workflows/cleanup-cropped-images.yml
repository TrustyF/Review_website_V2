name: Cleanup Cropped Images

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # cleanup_cropped_images itself never touches the DB, but `npm ci`
          # runs the postinstall `prisma generate` hook, and prisma.config.ts
          # eagerly resolves DATABASE_URL at config-load time — so it has to
          # be set here even though it's unused below.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run cleanup_cropped_images
        env:
          VERCEL: "1"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
